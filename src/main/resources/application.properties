# Nome da aplicação (usado como Issuer do Token)
spring.application.name=cine-the-golden-api

# Segredo do JWT (Em produção, use uma hash longa e segura)
api.security.token.secret=${JWT_SECRET:minha-senha-super-secreta-123}

# Configuração para mostrar o erro no console caso o token falhe
spring.web.error.include-exception=true
